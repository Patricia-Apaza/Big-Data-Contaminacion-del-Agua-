# PySpark + Jupyter del sistema AquaVigia (Equipo 02).
# Hardening de S14: healthcheck de Jupyter y token leido de pyspark/.env (no versionado; ver .env.example).
# Levantar (desde la raiz, unido a la red de Kafka):
#   docker compose -f pyspark/compose.yml -f pyspark/compose.kafka.yml up -d --build --wait
name: agua-pyspark

services:
  pyspark:
    container_name: agua-pyspark
    build:
      context: .
    restart: unless-stopped
    ports:
      - "4488:8888"
      - "4042:4040"
    volumes:
      - ./sesiones:/opt
    environment:
      - JUPYTER_TOKEN=${JUPYTER_TOKEN:-sintoken}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8888/api', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
